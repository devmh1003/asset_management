<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자산관리</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fed'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>₩</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>

<body>
  <div id="boot" class="boot">불러오는 중…</div>
  <div id="login" class="login" hidden></div>
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><span class="logo">₩</span><span>자산관리</span></div>
      <nav id="nav"></nav>
      <div class="side-foot"><span id="mode" class="badge"></span></div>
    </aside>
    <div class="content">
      <header class="top">
        <h1 id="page-title"></h1>
        <div class="top-actions">
          <button id="btn-down" class="btn">⬇ 엑셀 다운로드</button>
          <button id="btn-up" class="btn">⬆ 엑셀 업로드</button>
          <button id="btn-theme" class="btn" title="라이트/다크 전환">◐</button>
          <div id="user"></div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
