<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 스크립트는 자기 사이트·고정 버전 CDN·Firebase 에서만 실행 (외부 스크립트 주입 차단). connect-src 의 https: 는 사용자가 지정한 AI 엔드포인트용 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com/xlsx-0.20.3/ https://cdn.jsdelivr.net/npm/chart.js@4.4.1/ https://www.gstatic.com/firebasejs/ https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/gh/orioncactus/; font-src 'self' data: https://cdn.jsdelivr.net/gh/orioncactus/; img-src 'self' data: blob: https:; connect-src 'self' https: http://127.0.0.1:9199 http://127.0.0.1:8089 ws://127.0.0.1:8089; frame-src https://asset-management-6c342.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>자산관리</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6fed'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>₩</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="boot" class="boot">불러오는 중…</div>
  <div id="login" class="login" hidden></div>
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><span class="logo">₩</span><span>자산관리</span></div>
      <nav id="nav"></nav>
      <div class="side-foot"><span id="mode" class="badge"></span></div>
    </aside>
    <div class="content">
      <header class="top">
        <h1 id="page-title"></h1>
        <div class="top-actions">
          <button id="btn-down-page" class="btn" hidden>⬇ 이 페이지</button>
          <button id="btn-down" class="btn" title="모든 시트(자산·부채·부동산·현금흐름·KPI 등)를 한 파일로">⬇ 전체 엑셀</button>
          <button id="btn-up" class="btn">⬆ 엑셀 업로드</button>
          <button id="btn-theme" class="btn" title="라이트/다크 전환">◐</button>
          <div id="user"></div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
</body>
</html>
